name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: livecommerce
          POSTGRES_PASSWORD: livecommerce
          POSTGRES_DB: livecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Ruff (Linting)
      run: ruff check .

    - name: Run Mypy (Type Checking)
      run: mypy app

    - name: Run Pytest
      env:
        JWT_SECRET_KEY: "test-secret-key-not-for-production"
        DATABASE_URL: "postgresql+asyncpg://livecommerce:livecommerce@localhost:5432/livecommerce_test"
        TEST_DATABASE_URL: "postgresql+asyncpg://livecommerce:livecommerce@localhost:5432/livecommerce_test"
        DATABASE_URL_SYNC: "postgresql+psycopg2://livecommerce:livecommerce@localhost:5432/livecommerce_test"
      run: pytest -v